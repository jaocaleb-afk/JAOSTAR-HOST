<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAOSTAR Developer Gate</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0b1220;color:#eef2f7}
*{box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:min(460px,94vw);padding:28px;border:1px solid #263851;border-radius:14px;background:#101a2b;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:26px}.sub{color:#91a0b7;font-size:13px;margin:0 0 20px}
label{display:block;margin:12px 0 6px;font-size:12px;color:#b7c2d3}
input{width:100%;padding:11px;border-radius:8px;border:1px solid #31445e;background:#0b1220;color:#eef2f7;font-size:14px}
button{width:100%;padding:12px;margin-top:14px;border:0;border-radius:8px;background:#2d8cff;color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.08)}
#error{color:#ff8d8d;font-size:12px;margin-top:10px;min-height:16px}
#chooser{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.mode{padding:18px 10px;border:1px solid #31445e;border-radius:10px;background:#0b1220;color:#eef2f7;cursor:pointer;font-weight:700}
.mode:hover{border-color:#5d8fcf;background:#111d30}.mode small{display:block;color:#91a0b7;font-weight:400;margin-top:5px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:22px}}
</style>
</head>
<body>
<div id="gate" class="panel">
  <h1>Developer Gate</h1>
  <p class="sub">Enter developer credentials to open JAOSTAR.</p>
  <label for="devUser">Username</label>
  <input id="devUser" name="username" autocomplete="username">
  <label for="devPass">Password</label>
  <input id="devPass" name="password" type="password" autocomplete="current-password">
  <button id="loginBtn" type="button">Enter</button>
  <div id="error" aria-live="polite"></div>
</div>

<div id="chooser" class="panel">
  <h1>JAOSTAR</h1>
  <p class="sub">Select the mode you want to open.</p>
  <div class="grid">
    <button class="mode" data-mode="student" type="button">Student<small>Student Center</small></button>
    <button class="mode" data-mode="kiosk" type="button">Kiosk<small>Kiosk control panel</small></button>
    <button class="mode" data-mode="parent" type="button">Host (Parent)<small>Parent Command</small></button>
  </div>
</div>

function decodeSource(encoded){
  const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

const gate = document.getElementById('gate');
const chooser = document.getElementById('chooser');
const error = document.getElementById('error');
const loginBtn = document.getElementById('loginBtn');
const devUser = document.getElementById('devUser');
const devPass = document.getElementById('devPass');

function login(){
  const ok = devUser.value === 'cjao21' && devPass.value === 'alberte=mc2*';
  if(!ok){ error.textContent = 'Invalid developer credentials.'; return; }
  error.textContent = '';
  gate.style.display = 'none';
  chooser.style.display = 'block';
}

loginBtn.addEventListener('click', login);
devPass.addEventListener('keydown', event => {
  if(event.key === 'Enter') login();
});

function launch(mode){
  const source = decodeSource(SOURCES[mode]);
  // Load Claude's exact standalone HTML as the top-level document.
  // The source string is only transported here; it is not edited.
  document.open();
  document.write(source);
  document.close();
}

document.querySelectorAll('[data-mode]').forEach(button => {
  button.addEventListener('click', () => launch(button.dataset.mode));
});
</script>
